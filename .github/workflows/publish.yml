name: Publish to npm

# Runs on every push to main. When package.json has a version that isn't on npm yet, it runs the
# typecheck, tests and build, publishes, and tags the commit vX.Y.Z. Merging a version bump is the
# release. npm trusted publishing checks that this workflow in this repository is the one allowed to
# publish, so no npm token is stored anywhere, and npm attaches provenance automatically.
on:
  push:
    branches: [main]

permissions:
  contents: write # to push the vX.Y.Z tag
  id-token: write # lets npm verify which workflow is publishing

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Is this version new?
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Asks the registry directly: no npm auth is involved, so nothing can mistake a 401 for "new"
          if curl -sf -o /dev/null "https://registry.npmjs.org/infinity-knobs/$version"; then
            echo "infinity-knobs@$version is already on npm; nothing to publish"
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.version.outputs.new == 'true'
        uses: pnpm/action-setup@v6 # the version comes from packageManager in package.json
      - if: steps.version.outputs.new == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24 # ships npm 11.19; trusted publishing needs 11.5.1 or later
          registry-url: https://registry.npmjs.org
          package-manager-cache: false # no caches in release builds
      - if: steps.version.outputs.new == 'true'
        run: pnpm install --frozen-lockfile
      # prepublishOnly runs the typecheck, the tests and the build before anything is published
      - if: steps.version.outputs.new == 'true'
        run: npm publish --access public
      - if: steps.version.outputs.new == 'true'
        name: Tag the release
        run: |
          tag="v${{ steps.version.outputs.version }}"
          git tag "$tag"
          git push origin "$tag"
