<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>infinity-knobs example</title>
  <link rel="icon" href="../logo.svg" type="image/svg+xml">
  <style>
    :root {
      color-scheme: dark;
      --bg: #050805;
      --panel: #0d140d;
      --line: #1f2e1f;
      --text: #b8f5b8;
      --dim: #5f8a5f;
      --green: #00ff00;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--text);
      font: 15px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    main { width: min(30rem, 100% - 2rem); padding: 1.5rem 0; }
    h1 { font-size: 1.1rem; margin: 0 0 0.25rem; color: var(--green); }
    p { margin: 0 0 1rem; color: var(--dim); }
    label, button, input { font: inherit; }
    input[type="checkbox"] { width: auto; accent-color: var(--green); }
    .controls { display: flex; gap: 0.75rem; align-items: center; flex-wrap: wrap; margin-bottom: 1.25rem; }
    input {
      width: 4.5rem;
      padding: 0.3rem 0.5rem;
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 6px;
    }
    button {
      padding: 0.35rem 0.9rem;
      background: var(--panel);
      color: var(--green);
      border: 1px solid var(--green);
      border-radius: 6px;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: default; }
    .value {
      display: block;
      font-size: clamp(2rem, 9vw, 3.2rem);
      color: var(--green);
      text-shadow: 0 0 12px rgb(0 255 0 / 0.5);
      font-variant-numeric: tabular-nums;
    }
    .meter { height: 0.6rem; margin: 0.75rem 0 1.25rem; background: var(--panel); border: 1px solid var(--line); border-radius: 99px; overflow: hidden; }
    .meter div { height: 100%; width: 0; background: var(--green); box-shadow: 0 0 10px var(--green); transition: width 80ms linear; }
    dl { display: grid; grid-template-columns: auto 1fr; gap: 0.25rem 1.5rem; margin: 0 0 1rem; }
    dt { color: var(--dim); }
    dd { margin: 0; font-variant-numeric: tabular-nums; }
    #status { min-height: 1.5em; }
  </style>
</head>
<body>
  <main>
    <h1>infinity-knobs</h1>
    <p>Turn a knob to tune 20 Hz to 20 kHz: slowly for a quarter of a cent per value, fast for 50 cents.</p>
    <div class="controls">
      <button id="connect" type="button">Connect MIDI</button>
      <label>CC <input id="cc" type="number" min="0" max="127" value="3"></label>
      <label><input id="endless" type="checkbox" checked> endless</label>
    </div>
    <output id="value" class="value">440.000 Hz</output>
    <div class="meter" aria-hidden="true"><div id="meter"></div></div>
    <dl>
      <dt>speed</dt><dd id="speed">0.000</dd>
      <dt>rate</dt><dd id="rate">0 values/s</dd>
      <dt>last message</dt><dd id="last">none yet</dd>
      <dt>resets sent</dt><dd id="resets">0</dd>
    </dl>
    <p id="status">Build first (pnpm build), then serve the repository root over http://localhost.</p>
  </main>
  <script type="module">
    import { knob, requestMidiAccess } from '../dist/index.js'

    const $ = (id) => document.getElementById(id)
    // The library loaded, so the build hint in the markup (shown if it didn't) can go
    $('status').textContent = 'Plug in a MIDI controller, then press Connect MIDI.'
    let access
    let frequency
    let resets = 0
    let lastTurnAt = 0

    const show = (hz, turn) => {
      $('value').textContent = `${hz.toFixed(3)} Hz`
      $('speed').textContent = turn.speed.toFixed(3)
      $('rate').textContent = `${Math.round(turn.rate)} values/s`
      $('meter').style.width = `${turn.speed * 100}%`
      $('last').textContent = `CC ${turn.cc} = ${turn.value} on channel ${turn.channel + 1} (${turn.delta >= 0 ? '+' : ''}${turn.delta})`
      if (turn.recentred) $('resets').textContent = String(++resets)
      lastTurnAt = performance.now()
    }

    // (Re)binds the knob to the chosen CC, keeping its value
    const bind = () => {
      const value = frequency?.value ?? 440
      frequency?.dispose()
      frequency = knob(access, {
        cc: Number($('cc').value),
        value,
        min: 20,
        max: 20000,
        scale: 'exponential',
        fine: 0.25,
        coarse: 50,
        endless: $('endless').checked,
        onChange: show,
      })
    }

    // The meter falls back to rest once the knob stops
    const settle = () => {
      if (performance.now() - lastTurnAt > 250) $('meter').style.width = '0'
      requestAnimationFrame(settle)
    }

    $('connect').addEventListener('click', async () => {
      try {
        access = await requestMidiAccess()
        const names = [...access.inputs.values()].map((input) => input.name).join(', ')
        $('status').textContent = names ? `Listening to ${names}.` : 'No MIDI inputs yet; plug one in.'
        $('connect').disabled = true
        bind()
        requestAnimationFrame(settle)
      } catch (error) {
        $('status').textContent = error.message
      }
    })
    $('cc').addEventListener('change', () => access && bind())
    $('endless').addEventListener('change', () => access && bind())
  </script>
</body>
</html>
